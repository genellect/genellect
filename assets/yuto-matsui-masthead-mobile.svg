<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540" role="img" aria-labelledby="title desc">
  <title id="title">Yuto Matsui</title>
  <desc id="desc">AI-native full-stack developer building production systems across education, AI, and science. I turn domain problems into working products—from problem definition and system architecture to implementation, testing, deployment, and operations.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <style>
      .panel { fill: #f6f8fa; stroke: #d8dee4; }
      .name { fill: #111827; }
      .statement { fill: #4b5563; }
      .rule { stroke: #d8dee4; }
      @media (prefers-color-scheme: dark) {
        .panel { fill: #0d1117; stroke: #30363d; }
        .name { fill: #f0f6fc; }
        .statement { fill: #9da7b3; }
        .rule { stroke: #30363d; }
      }
    </style>
  </defs>

  <rect class="panel" x="1" y="1" width="718" height="538" rx="22"/>
  <rect x="30" y="36" width="5" height="468" rx="2.5" fill="url(#accent)"/>

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', sans-serif">
    <text class="name" x="62" y="112" font-size="74" font-weight="650" letter-spacing="-2.5">Yuto Matsui</text>
    <text class="name" x="64" y="166" font-size="28" font-weight="560">AI-native full-stack developer building</text>
    <text class="name" x="64" y="202" font-size="28" font-weight="560">production systems across education, AI,</text>
    <text class="name" x="64" y="238" font-size="28" font-weight="560">and science.</text>
    <text class="statement" x="64" y="322" font-size="28" font-weight="430">I turn domain problems into working products—</text>
    <text class="statement" x="64" y="363" font-size="28" font-weight="430">from problem definition and system architecture</text>
    <text class="statement" x="64" y="404" font-size="28" font-weight="430">to implementation, testing, deployment,</text>
    <text class="statement" x="64" y="445" font-size="28" font-weight="430">and operations.</text>
  </g>

  <line class="rule" x1="64" y1="270" x2="674" y2="270"/>
  <line class="rule" x1="64" y1="482" x2="674" y2="482"/>
</svg>
