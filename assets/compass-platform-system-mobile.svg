<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img" aria-labelledby="title desc">
  <title id="title">COMPASS Platform operational system</title>
  <desc id="desc">The public web application connects to an API and PostgreSQL, then uses an outbox and worker for reliable Google Drive permission delivery.</desc>
