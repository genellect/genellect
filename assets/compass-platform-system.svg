      <text x="161" y="292" fill="#7f8ea3" font-size="13" letter-spacing="1.5" text-anchor="middle">WEB</text>
    </g>
    <g>
      <rect x="454" y="178" width="216" height="78" rx="16" fill="#111722" stroke="#334155"/>
      <circle cx="489" cy="217" r="6" fill="#3b82f6"/>
      <text x="562" y="224" fill="#f8fafc" font-size="20" font-weight="600" text-anchor="middle">API</text>
    </g>
    <g>
      <ellipse cx="778" cy="184" rx="108" ry="25" fill="#111722" stroke="#334155"/>
      <path d="M670 184 V242 C670 256 718 268 778 268 C838 268 886 256 886 242 V184" fill="#111722" stroke="#334155"/>
      <ellipse cx="778" cy="242" rx="108" ry="25" fill="none" stroke="#334155"/>
      <text x="778" y="229" fill="#f8fafc" font-size="18" font-weight="600" text-anchor="middle">POSTGRESQL</text>
    </g>
    <g>
      <rect x="886" y="178" width="204" height="78" rx="16" fill="#111722" stroke="#334155"/>
      <path d="M916 201 H1060 M916 217 H1042 M916 233 H1052" stroke="#526175" stroke-width="4" stroke-linecap="round"/>
      <text x="988" y="286" fill="#f8fafc" font-size="18" font-weight="600" text-anchor="middle">OUTBOX</text>
    </g>
    <g>
      <rect x="1090" y="278" width="150" height="48" rx="24" fill="#111722" stroke="#334155"/>
      <circle cx="1120" cy="302" r="5" fill="#22d3ee"/>
      <text x="1175" y="308" fill="#f8fafc" font-size="17" font-weight="600" text-anchor="middle">WORKER</text>
    </g>
