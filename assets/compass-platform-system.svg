<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">COMPASS Platform operational system</title>
  <desc id="desc">The public web application connects to an API and PostgreSQL, then uses an outbox and worker for reliable Google Drive permission delivery.</desc>
  <defs>
    <linearGradient id="request" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="420" rx="24" fill="#0b0e13"/>
  <rect x="1" y="1" width="1598" height="418" rx="23" fill="none" stroke="#242b36"/>

  <path d="M238 217 H454 H670 H886" fill="none" stroke="url(#request)" stroke-width="3" filter="url(#glow)"/>
  <path d="M886 217 H1090 V302 H1240 V217 H1415" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="8 9" opacity="0.9"/>
  <path d="M562 217 V107 H430" fill="none" stroke="#2c3542" stroke-width="2"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <g>
