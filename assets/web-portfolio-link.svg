<svg xmlns="http://www.w3.org/2000/svg" width="760" height="128" viewBox="0 0 760 128" role="img" aria-labelledby="title desc">
  <title id="title">Explore My Web Portfolio</title>
  <desc id="desc">A compact illustrated link to Yuto Matsui's web portfolio.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <style>
      .panel { fill: #f6f8fa; stroke: #d8dee4; }
      .ink { fill: #111827; }
      .soft { fill: #e8f2ff; stroke: #93c5fd; }
      .detail { stroke: #2563eb; }
      .trail { stroke: #bfdbfe; }
      @media (prefers-color-scheme: dark) {
        .panel { fill: #0d1117; stroke: #30363d; }
        .ink { fill: #f0f6fc; }
        .soft { fill: #102a4c; stroke: #1d4ed8; }
        .detail { stroke: #60a5fa; }
        .trail { stroke: #1e3a5f; }
      }
    </style>
  </defs>

  <rect class="panel" x="1" y="1" width="758" height="126" rx="18"/>
  <rect x="20" y="22" width="4" height="84" rx="2" fill="url(#accent)"/>

  <g transform="translate(43 31)">
    <rect class="soft" x="0" y="0" width="76" height="66" rx="14"/>
    <circle cx="15" cy="15" r="3" fill="#2563eb"/>
    <circle cx="26" cy="15" r="3" fill="#22d3ee"/>
    <path class="detail" d="M15 31h46M15 42h31M15 53h39" fill="none" stroke-width="4" stroke-linecap="round"/>
  </g>

  <text class="ink" x="145" y="77" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', sans-serif" font-size="30" font-weight="650" letter-spacing="-0.5">Explore My Web Portfolio →</text>

  <path class="trail" d="M648 33c38 0 38 62 76 62" fill="none" stroke-width="2" stroke-linecap="round"/>
  <circle cx="648" cy="33" r="5" fill="#2563eb"/>
  <circle cx="724" cy="95" r="5" fill="#22d3ee"/>
</svg>
