<svg xmlns="http://www.w3.org/2000/svg" width="720" height="112" viewBox="0 0 720 112" role="img" aria-labelledby="title desc">
  <title id="title">Explore My Web Portfolio</title>
  <desc id="desc">A lightweight illustrated link to Yuto Matsui's web portfolio.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <style>
      .panel { fill: #f6f8fa; stroke: #d8dee4; }
      .ink { fill: #111827; }
      .soft { fill: #e8f2ff; stroke: #93c5fd; }
      .detail { stroke: #2563eb; }
      @media (prefers-color-scheme: dark) {
        .panel { fill: #0d1117; stroke: #30363d; }
        .ink { fill: #f0f6fc; }
        .soft { fill: #102a4c; stroke: #1d4ed8; }
        .detail { stroke: #60a5fa; }
      }
    </style>
  </defs>
  <rect class="panel" x="1" y="1" width="718" height="110" rx="18"/>
  <rect x="20" y="20" width="4" height="72" rx="2" fill="url(#accent)"/>
  <g transform="translate(90 27)">
    <rect class="soft" x="0" y="0" width="62" height="58" rx="13"/>
    <circle cx="13" cy="13" r="2.5" fill="#2563eb"/>
    <circle cx="23" cy="13" r="2.5" fill="#22d3ee"/>
    <path class="detail" d="M13 28h36M13 38h25M13 48h31" fill="none" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text class="ink" x="174" y="67" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', sans-serif" font-size="29" font-weight="640" letter-spacing="-0.25">Explore My Web Portfolio →</text>
</svg>
