<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="120" viewBox="0 0 1600 120" role="img" aria-labelledby="title desc">
  <title id="title">Explore My Web Portfolio</title>
  <desc id="desc">A lightweight illustrated link to Yuto Matsui's web portfolio.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <style>
      .panel { fill: #f6f8fa; stroke: #d8dee4; }
      .ink { fill: #111827; }
      .soft { fill: #e8f2ff; stroke: #93c5fd; }
      .detail { stroke: #2563eb; }
      @media (prefers-color-scheme: dark) {
        .panel { fill: #0d1117; stroke: #30363d; }
        .ink { fill: #f0f6fc; }
        .soft { fill: #102a4c; stroke: #1d4ed8; }
        .detail { stroke: #60a5fa; }
      }
    </style>
  </defs>
  <rect class="panel" x="1" y="1" width="1598" height="118" rx="18"/>
  <rect x="40" y="24" width="5" height="72" rx="2.5" fill="url(#accent)"/>
  <g transform="translate(520 28)">
    <rect class="soft" x="0" y="0" width="72" height="64" rx="14"/>
    <circle cx="15" cy="15" r="3" fill="#2563eb"/>
    <circle cx="26" cy="15" r="3" fill="#22d3ee"/>
    <path class="detail" d="M15 31h42M15 42h29M15 53h36" fill="none" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <text class="ink" x="620" y="72" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', sans-serif" font-size="32" font-weight="640" letter-spacing="-0.35">Explore My Web Portfolio →</text>
</svg>
