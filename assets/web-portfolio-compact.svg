<svg xmlns="http://www.w3.org/2000/svg" width="560" height="84" viewBox="0 0 560 84" role="img" aria-labelledby="title desc">
  <title id="title">Explore My Web Portfolio</title>
  <desc id="desc">A compact illustrated link to Yuto Matsui's web portfolio.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <style>
      .panel { fill: #f6f8fa; stroke: #d8dee4; }
      .ink { fill: #111827; }
      .soft { fill: #e8f2ff; stroke: #93c5fd; }
      .detail { stroke: #2563eb; }
      .trail { stroke: #bfdbfe; }
      @media (prefers-color-scheme: dark) {
        .panel { fill: #0d1117; stroke: #30363d; }
        .ink { fill: #f0f6fc; }
        .soft { fill: #102a4c; stroke: #1d4ed8; }
        .detail { stroke: #60a5fa; }
        .trail { stroke: #1e3a5f; }
      }
    </style>
  </defs>

  <rect class="panel" x="1" y="1" width="558" height="82" rx="14"/>
  <rect x="14" y="15" width="3" height="54" rx="1.5" fill="url(#accent)"/>

  <g transform="translate(29 20)">
    <rect class="soft" x="0" y="0" width="50" height="44" rx="10"/>
    <circle cx="10" cy="10" r="2" fill="#2563eb"/>
    <circle cx="18" cy="10" r="2" fill="#22d3ee"/>
    <path class="detail" d="M10 21h30M10 29h21M10 37h26" fill="none" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <text class="ink" x="97" y="51" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', sans-serif" font-size="21" font-weight="650" letter-spacing="-0.25">Explore My Web Portfolio →</text>

  <path class="trail" d="M488 23c22 0 22 38 44 38" fill="none" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="488" cy="23" r="3.5" fill="#2563eb"/>
  <circle cx="532" cy="61" r="3.5" fill="#22d3ee"/>
</svg>
