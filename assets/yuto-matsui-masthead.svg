<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="390" viewBox="0 0 1600 390" role="img" aria-labelledby="title desc">
  <title id="title">Yuto Matsui</title>
  <desc id="desc">AI-native full-stack developer building production systems across education, AI, and science. I turn domain problems into working products—from problem definition and system architecture to implementation, testing, deployment, and operations.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <style>
      .panel { fill: #f6f8fa; stroke: #d8dee4; }
      .name { fill: #111827; }
      .statement { fill: #4b5563; }
      .rule { stroke: #d8dee4; }
      @media (prefers-color-scheme: dark) {
        .panel { fill: #0d1117; stroke: #30363d; }
        .name { fill: #f0f6fc; }
        .statement { fill: #9da7b3; }
        .rule { stroke: #30363d; }
      }
    </style>
  </defs>

  <rect class="panel" x="1" y="1" width="1598" height="388" rx="22"/>
  <rect x="40" y="42" width="5" height="306" rx="2.5" fill="url(#accent)"/>

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', sans-serif">
    <text class="name" x="84" y="132" font-size="92" font-weight="650" letter-spacing="-3.5">Yuto Matsui</text>
    <text class="name" x="88" y="190" font-size="27" font-weight="560" letter-spacing="0.1">AI-native full-stack developer building production systems across education, AI, and science.</text>
    <text class="statement" x="88" y="270" font-size="26" font-weight="430">I turn domain problems into working products—from problem definition</text>
    <text class="statement" x="88" y="307" font-size="26" font-weight="430">and system architecture to implementation, testing, deployment,</text>
    <text class="statement" x="88" y="344" font-size="26" font-weight="430">and operations.</text>
  </g>

  <line class="rule" x1="88" y1="222" x2="1528" y2="222"/>
  <line class="rule" x1="88" y1="364" x2="1528" y2="364"/>
</svg>
